name: JingJian Smart Switch Sequence Gateway
version: "1.0.0"
slug: jingjian_sequence_gateway
description: Receives JingJian MQTT sequence commands and controls Zigbee2MQTT devices in order.
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: services
boot: auto
options:
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: cashier
  mqtt_password: cashier
  command_topic: jingjian/smart-switch/sequences/commands
  status_topic: jingjian/smart-switch/sequences/status
  zigbee_base_topic: zigbee2mqtt
  gateway_id: ha-sequence-gateway
  client_id: jingjian-sequence-gateway
schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  command_topic: str
  status_topic: str
  zigbee_base_topic: str
  gateway_id: str
  client_id: str
build_from:
  amd64: python:3.12-slim-bookworm
  aarch64: python:3.12-slim-bookworm
  armv7: python:3.12-slim-bookworm
